<section id="about" class="about">
  <div class="section-divider"></div>
  <div class="container">
    <div class="section-label animate">
      <span>{{ lang.t().sectionAbout }}</span>
      <div class="label-line"></div>
    </div>
    <div class="about-grid">
      <div class="about-text animate">
        <h2>{{ lang.t().aboutLine1 }}<br><span class="accent">{{ lang.t().aboutLine2 }}</span></h2>
        <p>{{ lang.t().aboutText1 }}</p>
      </div>
      <div class="stats-grid animate">
        <div class="stat-card">
          <div class="stat-number">5+</div>
          <div class="stat-label">{{ lang.t().statYears }}</div>
        </div>
        <div class="stat-card">
          <div class="stat-number">8+</div>
          <div class="stat-label">{{ lang.t().statTech }}</div>
        </div>
        <div class="stat-card">
          <div class="stat-number">∞</div>
          <div class="stat-label">{{ lang.t().statLearning }}</div>
        </div>
        <div class="stat-card">
          <div class="stat-number">100%</div>
          <div class="stat-label">{{ lang.t().statCommit }}</div>
        </div>
      </div>
    </div>
  </div>
</section>
