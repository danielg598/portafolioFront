# Cabeceras de seguridad compartidas. Se incluyen en cada "location" que
# define sus propios add_header (nginx no hereda add_header del server en
# ese caso).
#
# CSP: la app solo carga recursos propios, salvo las fuentes de Google
# (styles.scss) y los estilos inline que Angular genera por componente.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
