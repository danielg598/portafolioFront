# Nginx del contenedor frontend: solo sirve el bundle estático de Angular.
# TLS, dominio y el enrutamiento de /api/ los resuelve el proxy central
# (nginx-proxy), que reenvía a este contenedor por la red Docker "edge".
# Corre como usuario sin privilegios (imagen nginx-unprivileged), por eso
# escucha en 8080 y no en 80.

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Healthcheck del contenedor (lo usa Docker, no se expone por el proxy).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Archivos con hash en el nombre (outputHashing: all): cache agresivo,
    # si cambia el contenido cambia el nombre.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
    }

    # index.html nunca se cachea: un despliegue nuevo se ve de inmediato y
    # apunta a los bundles con hash nuevos.
    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }

    # Fallback del Angular Router: cualquier ruta que no sea un archivo real
    # (por ejemplo /proyectos al recargar) se resuelve con index.html y el
    # router del lado del cliente decide qué mostrar.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }
}
