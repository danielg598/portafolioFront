# Config de Nginx para el deploy en VM propia (usada por Dockerfile). NO
# se usa mientras el deploy temporal esté en Render (Static Site, ver
# render.yaml) — se mantiene intacta para cuando se retome el plan original.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión para los bundles de JS/CSS.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Los archivos con hash en el nombre (outputHashing: all) pueden cachearse
    # agresivamente: si cambia el contenido, cambia el nombre del archivo.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Fallback del Angular Router: cualquier ruta que no sea un archivo real
    # (por ejemplo /proyectos o /contacto al recargar la página) se resuelve
    # sirviendo index.html, y es el router del lado del cliente quien decide
    # qué componente mostrar.
    #
    # Nota: /api/ NO se maneja aquí. El proxy central (nginx-proxy en
    # C:\desarrollos\nginx-proxy) enruta /api/ directo al contenedor
    # "backend", sin pasar por este Nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
